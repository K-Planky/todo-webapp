# Deploy to the kplanky.dev VPS. Runs after CI succeeds on main, or on demand.
# Required repo secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (see vps-setup/DEPLOY.md).
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-todo
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  APP: todo
  IMAGE: ghcr.io/k-planky/todo-webapp
  DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only ship what CI validated on THIS repo's main.
    #
    # head_branch alone is not a trust boundary: on a workflow_run fired by a fork's pull request
    # it is the FORK's branch name, so a fork branch named `main` passes. workflow_run is a
    # privileged trigger (it carries this repo's secrets), and the checkout below takes
    # workflow_run.head_sha, so that combination would build and deploy fork-authored code to the
    # VPS. Pin the event type and the head repository as well.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64      # the VPS is amd64, an arm64-only image will not pull
          tags: |
            ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes ${DEPLOY_USER}@${DEPLOY_HOST}"
          # compose.yaml and the Caddy route are versioned in this repo under deploy/
          scp -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            deploy/compose.yaml "${DEPLOY_USER}@${DEPLOY_HOST}:/srv/apps/${APP}/compose.yaml"
          scp -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            deploy/site.caddy "${DEPLOY_USER}@${DEPLOY_HOST}:/srv/edge/sites/${APP}.caddy"
          $SSH "cd /srv/apps/${APP} && \
            export APP_IMAGE='${IMAGE}:${DEPLOY_SHA}' && \
            docker compose pull && \
            docker compose up -d && \
            docker exec edge-caddy caddy reload --config /etc/caddy/Caddyfile && \
            docker image prune -f"
